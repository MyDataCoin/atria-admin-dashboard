name: CI + Deploy

# Build on every push/PR; deploy the built static site to the Ubuntu server only on
# pushes to the default branch (and manual runs). All connection details are GitHub
# Secrets — nothing sensitive lives in this file.
#
# Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (key-only — password auth on the
# production host was removed; it also carries the DB password and provider keys through the same session)
# (SSH port defaults to 22; auth is password-based.)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Where the static site lives on the server. The deploy user must be able to write here
# (chown the dir to DEPLOY_USER once, or use a path under its home). Point your web
# server (nginx/Caddy) document root at this directory.
env:
  TARGET_DIR: /opt/atria/dashboard

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bug-class rules only (undefined identifiers, hook rules) — see eslint.config.js for why the
      # pre-existing hygiene backlog is warnings for now.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Hand the built output to the deploy job so we never rebuild (or ship source).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  security:
    name: Dependencies & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is still a leaked secret.
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails on a high or critical advisory in anything that ships to the browser.
      - name: Audit runtime dependencies
        run: npm run audit

      - name: Gitleaks
        # The gitleaks ACTION requires a paid licence for organisation-owned repositories; the
        # scanner it wraps does not. Pinned by digest-less tag on the official image, which is the
        # same binary without the licence check.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            detect --source . --redact --no-banner --verbose

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build, security]
    # Never deploy from pull requests (incl. forks) — only direct pushes / manual runs.
    if: github.event_name != 'pull_request'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy credentials
        # appleboy/ssh-action reports a missing key as "can't connect without a private SSH key or
        # password", which does not say WHICH secret is absent or what to do about it. Fail here
        # instead, before a bundle is built and copied, with the actual instruction.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          # Either credential will do. The key is preferred; the password keeps the deploy
          # working until one is issued.
          if [ -z "$DEPLOY_SSH_KEY" ] && [ -z "$DEPLOY_SSH_PASSWORD" ]; then
            missing="$missing DEPLOY_SSH_KEY-or-DEPLOY_SSH_PASSWORD"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Set DEPLOY_SSH_PASSWORD to deploy with the password you already have, or"
            echo "DEPLOY_SSH_KEY to switch to key authentication (preferred — the same session"
            echo "carries the database password and the provider API keys to the server):"
            echo "  ssh-keygen -t ed25519 -C 'github-actions-deploy' -f ./atria_deploy -N ''"
            echo "  ssh-copy-id -i ./atria_deploy.pub $DEPLOY_USER@$DEPLOY_HOST"
            echo "  gh secret set DEPLOY_SSH_KEY < ./atria_deploy   # the PRIVATE key, whole file"
            echo "  rm ./atria_deploy ./atria_deploy.pub"
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deploying with a PASSWORD. This session also carries the database" \
                 "password and the provider API keys — move to DEPLOY_SSH_KEY when one is issued."
          else
            echo "Deploying with an SSH key."
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Pack the built files (contents of dist/, without the leading dist/ folder).
      - name: Package deployment bundle
        run: tar -czf deploy.tar.gz -C dist .

      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Key first, password as a fallback. appleboy's actions use whichever is non-empty, so
          # provisioning DEPLOY_SSH_KEY later switches this over on its own — no workflow edit, and
          # the password stops being consulted the moment a key exists.
          #
          # SECURITY: a password on the production host is the weakest link in this pipeline. The
          # same session carries POSTGRES_PASSWORD, DIDIT_API_KEY and NIKITA_PRO_API_KEY to the
          # server, so whoever holds it holds those too. Finding M-14 of the 2026-08-04 review stays
          # OPEN until a key is issued and `PasswordAuthentication no` is set on the host.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Unpack and publish on the server
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DIR: ${{ env.TARGET_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Key first, password as a fallback. appleboy's actions use whichever is non-empty, so
          # provisioning DEPLOY_SSH_KEY later switches this over on its own — no workflow edit, and
          # the password stops being consulted the moment a key exists.
          #
          # SECURITY: a password on the production host is the weakest link in this pipeline. The
          # same session carries POSTGRES_PASSWORD, DIDIT_API_KEY and NIKITA_PRO_API_KEY to the
          # server, so whoever holds it holds those too. Finding M-14 of the 2026-08-04 review stays
          # OPEN until a key is issued and `PasswordAuthentication no` is set on the host.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: TARGET_DIR
          script: |
            set -euo pipefail

            # Fresh directory each deploy so files removed in git don't linger on the server.
            mkdir -p "$TARGET_DIR"
            find "$TARGET_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            tar -xzf /tmp/deploy.tar.gz -C "$TARGET_DIR"
            rm -f /tmp/deploy.tar.gz

            # Best-effort reload of the web server if it's installed on this host.
            if command -v nginx >/dev/null 2>&1; then
              nginx -t && (systemctl reload nginx 2>/dev/null || sudo systemctl reload nginx 2>/dev/null || true)
            fi

            echo "Deployed to $TARGET_DIR"
            ls -la "$TARGET_DIR"
