# Проксирование медиа для admin.atria.kg.
#
# ЗАЧЕМ. Риелторский каталог обрезает абсолютный адрес фото
# (https://api.atria.kg/media/...) до относительного /media/... — см. toMediaUrl в
# src/realtor/api/properties.js. Сделано это ради брошюры: html-to-image рисует
# карточку в canvas, а canvas откажется работать с чужим доменом, который не
# отдаёт CORS-заголовки. То же и с документами: их скачивает fetch, а не <a href>.
#
# В dev этот путь перехватывает прокси Vite (vite.config.ts, блок '/media').
# В проде такого прокси не было, и /media/... попадал в SPA-фолбэк: nginx отдавал
# index.html с кодом 200, браузер получал text/html вместо image/webp и рисовал
# битую картинку. Ломались разом фото в каталоге, брошюры и скачивание документов.
#
# КУДА КЛАСТЬ. Блок ниже — внутрь существующего server { listen 443 ssl; } для
# admin.atria.kg, рядом с уже работающим location /api/.
#
#   sudo nano /etc/nginx/sites-available/admin.atria.kg
#   sudo nginx -t && sudo systemctl reload nginx
#
# ПРОВЕРКА (должно быть 200 и image/webp, а не text/html):
#   curl -sI https://admin.atria.kg/media/images/bec7ac1d2a2e4f4698a945421ddd99bb.webp | head -3

location /media/ {
    # Без пути в proxy_pass префикс /media сохраняется — именно его ждёт nginx на api.atria.kg.
    proxy_pass https://api.atria.kg;
    proxy_http_version 1.1;

    # Host обязателен: у api.atria.kg виртуальный хост, по IP он это отдавать не станет.
    proxy_set_header Host api.atria.kg;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SNI для TLS-рукопожатия с апстримом.
    proxy_ssl_server_name on;

    # Медиа неизменяемо (имя файла — uuid), поэтому кэш апстрима пробрасываем как есть
    # и добавляем свой на случай, если апстрим его не проставил.
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
}
